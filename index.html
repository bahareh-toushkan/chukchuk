<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>척척 조달관</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317306e'/%3E%3Cpath d='M10 16h8l6 24h24l5-17H21' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='27' cy='49' r='4.5' fill='%23ffc933'/%3E%3Ccircle cx='45' cy='49' r='4.5' fill='%23ffc933'/%3E%3C/svg%3E">
<style>
:root{--navy:#17306e;--blue:#2f6fde;--blue2:#1d4fae;--ink:#1b2540;--mute:#5b6784;--line:#cfd9ee;--ok:#1f9d63;--no:#e04a3a;--gold:#ffc933;--warm:#f59331}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
html,body{height:100%;overflow:hidden}
body{background:#0f2152;color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation;line-height:1.3}
button{font:inherit;color:inherit}
svg{display:block}
#app{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,#dfeaff 0%,#f2f7ff 45%,#ffffff 100%);overflow:hidden}

/* 상단 표시줄 */
#hud{height:3.4rem;flex:none;display:flex;align-items:center;gap:.8rem;padding:0 1rem;background:var(--navy);color:#fff}
.dots{display:flex;gap:.35rem;flex:none}
.dot{width:1.7rem;height:1.7rem;border-radius:50%;background:rgba(255,255,255,.18);font-size:.9rem;font-weight:700;display:grid;place-items:center}
.dot.on{background:var(--gold);color:var(--navy)}
.dot.done{background:#fff;color:var(--navy)}
#hudTitle{flex:1;font-weight:700;font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hudStars{font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:.3rem;flex:none}
#hudStars svg{width:1.3rem;height:1.3rem}
#sndBtn{appearance:none;border:0;background:rgba(255,255,255,.16);width:2.3rem;height:2.3rem;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:none}
#sndBtn svg{width:1.4rem;height:1.4rem}
#timer{height:.55rem;background:#c3d2f3;flex:none}
#timer i{display:block;height:100%;width:100%;background:var(--blue);transform-origin:left center}
#timer.low i{background:var(--no)}

#main{flex:1;position:relative;min-height:0;padding:.8rem 1rem .4rem;display:flex;flex-direction:column}

/* 안내 캐릭터 */
#guide{flex:none;height:6.2rem;display:flex;align-items:flex-end;gap:.9rem;padding:0 1rem calc(.4rem + env(safe-area-inset-bottom))}
#guide img{height:5.6rem;width:auto;flex:none;filter:drop-shadow(0 .2rem .3rem rgba(23,48,110,.25))}
#bubble{flex:1;background:#fff;border:.14rem solid var(--navy);border-radius:1rem;padding:.5rem .9rem;font-size:1.14rem;font-weight:600;line-height:1.35;min-height:3.7rem;display:flex;align-items:center;margin-bottom:.7rem;position:relative}
#bubble::before{content:"";position:absolute;left:-.62rem;bottom:1rem;width:1rem;height:1rem;background:#fff;border-left:.14rem solid var(--navy);border-bottom:.14rem solid var(--navy);transform:rotate(45deg)}
#bubble.good{border-color:var(--ok)}#bubble.good::before{border-color:var(--ok)}
#bubble.bad{border-color:var(--no)}#bubble.bad::before{border-color:var(--no)}

/* 덮개 화면 */
#ov{position:absolute;inset:0;background:rgba(15,33,82,.6);display:none;align-items:center;justify-content:center;padding:1rem;z-index:20}
#ov.show{display:flex}
.panel{background:#fff;border-radius:1.4rem;padding:1.5rem 1.8rem;width:34rem;max-width:100%;max-height:100%;overflow:auto;text-align:center;box-shadow:0 1rem 2.5rem rgba(0,0,0,.3);animation:popin .25s ease-out}
.port .panel{padding:1.3rem 1.1rem}
.panel .no{display:inline-block;background:var(--sky,#e9f1ff);color:var(--navy);font-weight:800;font-size:1rem;padding:.2rem .9rem;border-radius:999px}
.panel h2{font-size:1.9rem;font-weight:900;color:var(--navy);margin:.5rem 0 .3rem}
.panel .how{font-size:1.2rem;font-weight:600;margin:.4rem 0 .2rem}
.panel .demo{display:flex;justify-content:center;align-items:center;gap:.8rem;margin:.8rem 0;font-weight:700;color:var(--mute);font-size:1rem}
.panel .demo .ic{width:4rem;height:4rem}
.panel .fact{background:#f2f6ff;border-radius:1rem;padding:.8rem 1rem;text-align:left;font-size:1.05rem;line-height:1.5;margin:.8rem 0 .4rem}
.panel .fact b{color:var(--navy)}
.panel .src{font-size:.82rem;color:var(--mute);text-align:left;margin-bottom:.8rem}
.stars{display:flex;justify-content:center;gap:.4rem;margin:.5rem 0}
.stars svg{width:3rem;height:3rem;animation:starin .35s ease-out backwards}
.stars svg:nth-child(2){animation-delay:.18s}.stars svg:nth-child(3){animation-delay:.36s}
.btn{appearance:none;border:0;background:var(--blue);color:#fff;font-weight:800;font-size:1.3rem;padding:.75rem 2.4rem;border-radius:999px;cursor:pointer;box-shadow:0 .3rem 0 var(--blue2);margin-top:.5rem}
.btn:active{transform:translateY(.2rem);box-shadow:0 .1rem 0 var(--blue2)}
.btn.ghost{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 .14rem var(--navy);font-size:1.05rem;padding:.55rem 1.4rem}

/* 첫 화면, 마지막 화면 */
.full{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.2rem;background:linear-gradient(180deg,#17306e 0%,#2456b8 55%,#6fa4f5 100%);color:#fff;overflow:auto}
.full.show{display:flex}
.t-kicker{font-size:1.1rem;font-weight:700;opacity:.9;letter-spacing:.05em}
.t-title{font-size:4.2rem;font-weight:900;line-height:1.1;margin:.3rem 0 .5rem;text-shadow:0 .25rem 0 rgba(0,0,0,.18)}
.port .t-title{font-size:3rem}
.t-sub{font-size:1.35rem;font-weight:600}
.t-art{display:flex;align-items:flex-end;justify-content:center;gap:1rem;margin:1.2rem 0 1rem}
.t-art img{height:9rem;width:auto;filter:drop-shadow(0 .4rem .5rem rgba(0,0,0,.25))}
.t-art .cart{width:10rem;height:10rem}
.port .t-art img{height:7rem}.port .t-art .cart{width:7.4rem;height:7.4rem}
.full .btn{background:var(--gold);color:var(--navy);box-shadow:0 .3rem 0 #c79a12;font-size:1.6rem;padding:.85rem 3rem}
.t-note{font-size:.98rem;opacity:.92;margin-top:1rem}
.t-credit{font-size:.78rem;opacity:.75;margin-top:.5rem;line-height:1.5}
#final{background:linear-gradient(180deg,#17306e 0%,#2456b8 100%)}
.f-card{background:#fff;color:var(--ink);border-radius:1.4rem;padding:1.2rem 1.5rem;width:44rem;max-width:100%;max-height:100%;overflow:auto;box-shadow:0 1rem 2.5rem rgba(0,0,0,.3)}
.f-top{display:flex;align-items:center;justify-content:center;gap:1rem}
.f-top img{height:5.5rem}
.f-rank{font-size:2.2rem;font-weight:900;color:var(--navy)}
.f-total{font-size:1.2rem;font-weight:700;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:.3rem}
.f-total svg{width:1.4rem;height:1.4rem}
.f-list{list-style:none;margin:.8rem 0;text-align:left;display:grid;gap:.35rem}
.f-list li{display:flex;align-items:center;gap:.6rem;background:#f2f6ff;border-radius:.8rem;padding:.45rem .8rem;font-size:1.05rem;font-weight:600}
.f-list .n{width:1.6rem;height:1.6rem;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:.9rem;font-weight:800;flex:none}
.f-list .tx{flex:1}
.f-list .st{display:flex;gap:.1rem;flex:none}.f-list .st svg{width:1.2rem;height:1.2rem}
.f-msg{font-size:1.1rem;font-weight:700;color:var(--navy);margin:.4rem 0}
.f-btns{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;align-items:center}
.f-src{display:none;text-align:left;font-size:.8rem;color:var(--mute);line-height:1.55;margin-top:.8rem;border-top:.1rem solid var(--line);padding-top:.6rem;-webkit-user-select:text;user-select:text}
.f-src.show{display:block}

/* 공통 카드 */
.card{background:#fff;border:.14rem solid var(--line);border-radius:1.1rem}
.ic{flex:none}.ic svg{width:100%;height:100%}
.req{padding:.6rem 1rem;display:flex;align-items:center;gap:.9rem;flex:none}
.req .ic{width:3.8rem;height:3.8rem}
.req h3{font-size:.98rem;color:var(--mute);font-weight:700}
.req .what{font-size:1.45rem;font-weight:900;line-height:1.25}
.pills{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.3rem}
.pill{font-size:1.02rem;font-weight:800;padding:.15rem .7rem;border-radius:999px;background:#fff3d6;color:#7a4e00;border:.1rem solid #f0cf7a}
.rnd{margin-left:auto;font-weight:800;color:var(--mute);font-size:1rem;flex:none;align-self:flex-start}
.opts{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-top:.7rem;min-height:0}
.port .opts{grid-template-columns:1fr;grid-template-rows:repeat(3,1fr);gap:.55rem}
.opt{appearance:none;text-align:left;background:#fff;border:.18rem solid var(--line);border-radius:1.1rem;padding:.7rem 1rem;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:.5rem;position:relative;transition:transform .12s,border-color .12s;min-height:0}
.port .opt{flex-direction:row;align-items:center;gap:.8rem;padding:.4rem .9rem}
.opt:active{transform:scale(.98)}
.opt .bl{display:flex;flex-direction:column;gap:.3rem}
.port .opt .bl{width:7.2rem;flex:none}
.opt .br{display:flex;flex-direction:column;gap:.35rem;flex:1}
.opt .nm{font-size:1.25rem;font-weight:900;color:var(--navy)}
.opt .row{display:flex;align-items:center;gap:.5rem;font-size:1.05rem}
.opt .row span{color:var(--mute);width:2.8rem;flex:none;font-weight:600}
.opt .row b{font-size:1.4rem}
.mk{width:1.5rem;height:1.5rem;margin-left:auto;visibility:hidden;flex:none}
.reveal .mk{visibility:visible}
.favor{font-size:.9rem;font-weight:800;color:#a0351f;background:#ffe9e4;border-radius:.6rem;padding:.25rem .5rem;line-height:1.25}
.opt.right{border-color:var(--ok);background:#effaf4}
.opt.wrong{border-color:var(--no);background:#fff1ef;animation:shake .3s}
.opt.dim{opacity:.55}

/* 2 검사 */
.s2{flex:1;display:flex;flex-direction:column;min-height:0}
.s2top{display:flex;align-items:center;gap:1rem;flex:none}
.sample{background:#fff;border:.16rem dashed var(--blue);border-radius:1rem;padding:.3rem 1rem .3rem .6rem;display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.05rem}
.sample .ic{width:4.2rem;height:4.2rem}
.sample small{display:block;font-size:.85rem;color:var(--mute);font-weight:700}
.cnt{margin-left:auto;font-weight:800;font-size:1.1rem;text-align:right;line-height:1.5}
.cnt b{color:var(--ok)}.cnt i{font-style:normal;color:var(--no)}
.beltwrap{flex:1;position:relative;min-height:0;display:flex;align-items:center}
.belt{position:relative;width:100%;height:9.4rem}
.track{position:absolute;left:0;right:6rem;bottom:0;height:2.2rem;border-radius:1.1rem;background:repeating-linear-gradient(90deg,#3b4a6b 0 1rem,#52648e 1rem 2rem);background-size:2rem 100%;animation:beltmove .5s linear infinite}
.truck{position:absolute;right:0;bottom:0;width:6.6rem;height:6.6rem}
.truck.alert{animation:shake .3s}
.item{position:absolute;left:0;bottom:1.9rem;width:5.8rem;height:5.8rem;margin-left:-2.9rem;cursor:pointer;touch-action:none}
.item svg{width:100%;height:100%;pointer-events:none}
.item.out{animation:dropout .45s forwards;pointer-events:none}
.item.okd::after,.item.out::after{content:attr(data-st);position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-12deg);font-weight:900;font-size:1.05rem;padding:.1rem .45rem;border:.16rem solid var(--no);color:var(--no);background:rgba(255,255,255,.9);border-radius:.4rem;white-space:nowrap}
.item.okd::after{border-color:var(--ok);color:var(--ok)}

/* 3 혁신제품 */
.opt.prod{align-items:center;text-align:center;gap:.4rem}
.port .opt.prod{text-align:left}
.prod .ic{width:5.4rem;height:5.4rem}
.port .prod .ic{width:4rem;height:4rem}
.prod .nm{font-size:1.2rem;line-height:1.25}
.badge{display:inline-block;font-size:.8rem;font-weight:800;background:var(--navy);color:#fff;border-radius:.4rem;padding:.1rem .5rem}
.flow{position:absolute;left:1rem;right:1rem;bottom:.6rem;display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;z-index:5;pointer-events:none}
.flow span{background:var(--ok);color:#fff;font-weight:800;font-size:1.05rem;padding:.4rem .9rem;border-radius:999px;animation:popin .25s ease-out backwards;box-shadow:0 .2rem .5rem rgba(0,0,0,.2)}
.flow span:nth-child(2){animation-delay:.35s}.flow span:nth-child(3){animation-delay:.7s}

/* 4 비축 */
.s4{flex:1;display:flex;flex-direction:column;min-height:0;gap:.55rem}
.phase{flex:none;align-self:center;font-weight:800;font-size:1.15rem;padding:.25rem 1.2rem;border-radius:999px;background:#e2f5ea;color:#12643f}
.phase.crisis{background:#ffe3de;color:#a0251a;animation:blink .45s 3}
.field{flex:1;position:relative;min-height:0;border-radius:1.1rem;background:linear-gradient(#cfe6ff,#eef6ff);overflow:hidden;border:.12rem solid var(--line)}
.ingot{position:absolute;width:6rem;height:3rem;margin:-1.5rem 0 0 -3rem;cursor:pointer;animation:popin .2s ease-out;touch-action:none;display:grid;place-items:center;font-weight:900;font-size:1.05rem;color:#1b2540;clip-path:polygon(12% 0,88% 0,100% 100%,0 100%);border-radius:.3rem}
.ingot.gone{animation:fadeout .25s forwards;pointer-events:none}
.ware{flex:none;display:grid;grid-template-columns:repeat(6,1fr);gap:.5rem}
.port .ware{grid-template-columns:repeat(3,1fr)}
.slot{appearance:none;background:#fff;border:.16rem solid var(--line);border-radius:.9rem;padding:.4rem .3rem;display:flex;flex-direction:column;align-items:center;gap:.3rem;cursor:pointer}
.slot .chip{width:82%;height:1.9rem;display:grid;place-items:center;font-weight:900;font-size:1rem;clip-path:polygon(10% 0,90% 0,100% 100%,0 100%)}
.pips{display:flex;gap:.22rem}
.pip{width:1rem;height:.5rem;border-radius:.2rem;background:#dfe6f5}
.pip.on{background:var(--navy)}
.slot.hit{border-color:var(--ok);animation:pulse .3s}
.slot.miss{border-color:var(--no);animation:shake .3s}
.ask{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:1.2rem}
.ask .ic{width:8rem;height:8rem}
.port .ask .ic{width:6rem;height:6rem}
.ask.run .ic{animation:pulse .4s}
.askb{background:#fff;border:.16rem solid var(--navy);border-radius:1rem;padding:.6rem 1rem;font-size:1.25rem;font-weight:800;text-align:center;min-width:11rem}
.askb .chip{display:inline-grid;place-items:center;width:6rem;height:2.4rem;font-weight:900;clip-path:polygon(10% 0,90% 0,100% 100%,0 100%);margin:.2rem auto}
.ring{height:.5rem;background:#dfe6f5;border-radius:.3rem;overflow:hidden;margin-top:.4rem}
.ring i{display:block;height:100%;background:var(--warm);transform-origin:left center;animation:shrink 3s linear forwards}

/* 5 해외 연결 */
.s5{flex:1;position:relative;display:flex;min-height:0;gap:.8rem}
.land .s5{flex-direction:row;justify-content:space-between}
.port .s5{flex-direction:column;justify-content:space-between}
.col{display:flex;gap:.7rem;z-index:2}
.land .col{flex-direction:column;justify-content:center;width:21rem}
.port .col{flex-direction:row;gap:.4rem}
.colh{position:absolute;font-weight:800;font-size:.95rem;color:var(--mute)}
.node{appearance:none;background:#fff;border:.18rem solid var(--line);border-radius:1rem;padding:.6rem .9rem;display:flex;align-items:center;gap:.7rem;cursor:pointer;position:relative;flex:1;max-height:6.6rem;text-align:left;min-width:0}
.port .node{flex-direction:column;text-align:center;padding:.5rem .25rem;gap:.25rem;max-height:none;flex:1 1 0}
.node .ic{width:3.6rem;height:3.6rem}
.node .t1{font-size:.85rem;color:var(--mute);font-weight:700}
.node .t2{font-size:1.1rem;font-weight:800;line-height:1.25}
.port .node .t2{font-size:.98rem}
.node.sel{border-color:var(--blue);box-shadow:0 0 0 .25rem rgba(47,111,222,.25)}
.node.done{border-color:var(--ok);background:#effaf4;cursor:default}
.node.wrong{border-color:var(--no);animation:shake .3s}
.gp{position:absolute;top:-.7rem;right:-.3rem;background:var(--navy);color:#fff;font-size:.78rem;font-weight:800;padding:.15rem .5rem;border-radius:.4rem;transform:rotate(6deg);animation:popin .25s ease-out}
svg.links{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}
.plane{position:absolute;width:2.6rem;height:2.6rem;margin:-1.3rem 0 0 -1.3rem;z-index:3;pointer-events:none}

.pop{position:absolute;z-index:10;pointer-events:none;font-weight:900;font-size:1.3rem;transform:translate(-50%,-50%);animation:floatup .7s ease-out forwards;white-space:nowrap;text-shadow:0 0 .2rem #fff,0 0 .2rem #fff}
.pop.g{color:var(--ok)}.pop.b{color:var(--no)}

/* 가로 화면(PC)에서 더 크게 */
body{word-break:keep-all;overflow-wrap:anywhere}
.land .panel{width:40rem}
.land .opt{padding:1.2rem 1.6rem;gap:.9rem}
.land .opt .br{flex:none;gap:.6rem}
.land .opt .nm{font-size:1.6rem}
.land .opt .row{font-size:1.25rem}
.land .opt .row span{width:3.6rem}
.land .opt .row b{font-size:1.95rem}
.land .mk{width:1.9rem;height:1.9rem}
.land .favor{font-size:1.05rem}
.land .prod .ic{width:8.4rem;height:8.4rem}
.land .prod .nm{font-size:1.5rem}
.land .badge{font-size:.95rem}
.land .belt{height:13.4rem}
.land .track{height:3rem;right:8.6rem;border-radius:1.5rem}
.land .truck{width:9.6rem;height:9.6rem}
.land .item{width:8.4rem;height:8.4rem;margin-left:-4.2rem;bottom:2.6rem}
.land .item.okd::after,.land .item.out::after{font-size:1.35rem}
.land .ingot{width:7.6rem;height:3.6rem;margin:-1.8rem 0 0 -3.8rem;font-size:1.25rem}
.land .node .ic{width:4.4rem;height:4.4rem}
.land .node .t2{font-size:1.3rem}
.land .node .t1{font-size:.95rem}
.full .btn.ghost{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 .14rem var(--navy);font-size:1.05rem;padding:.55rem 1.4rem;margin-top:.5rem}
.port .hx{display:none}
.f-total,.f-rank{white-space:nowrap}
.port .f-card{padding:1rem}.port .f-top{gap:.5rem}.port .f-top img{height:3.6rem}.port .f-rank{font-size:1.75rem}.port .f-total{font-size:1.05rem}
.gov{position:absolute;top:1rem;left:1rem;background:#fff;border-radius:.7rem;padding:.4rem .8rem;box-shadow:0 .2rem .5rem rgba(0,0,0,.22)}
.gov img{height:2.5rem;width:auto;display:block}
.port .gov{top:.7rem;left:.7rem;padding:.3rem .6rem}.port .gov img{height:1.9rem}
#cur{position:fixed;left:0;top:0;width:2.4rem;height:2.4rem;z-index:99;pointer-events:none;transform:translate(-9rem,-9rem)}
.rip{position:fixed;width:3.6rem;height:3.6rem;margin:-1.8rem 0 0 -1.8rem;border-radius:50%;border:.28rem solid #ffc933;z-index:98;pointer-events:none;animation:rip .45s ease-out forwards}
@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(1.25);opacity:0}}
@keyframes popin{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes starin{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-.4rem)}75%{transform:translateX(.4rem)}}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes blink{50%{opacity:.35}}
@keyframes beltmove{from{background-position:0 0}to{background-position:2rem 0}}
@keyframes dropout{to{transform:translateY(4rem) rotate(18deg);opacity:0}}
@keyframes fadeout{to{transform:scale(.5);opacity:0}}
@keyframes floatup{from{opacity:1}to{opacity:0;margin-top:-2.6rem}}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
</style>
</head>

  bad:(c,o,t)=>SY.tone(c,o,t,210,.2,'sawtooth',.1,140),

 function ensure(){if(REC)return false;try{if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;ctx=new AC();master=ctx.createGain();master.gain.value=on?.6:0;master.connect(ctx.destination);}if(ctx.state==='suspended')ctx.resume();return true;}catch(e){return false;}}

 return{play,music,toggle,get on(){return on;}};})();

function fit(){const w=innerWidth,h=innerHeight,land=w/h>=1.2;
 const aw=land?Math.min(w,h*2.0):Math.min(w,h*0.8);
 const fs=land?Math.min(aw/64,h/36):Math.min(aw/25,h/44);
 document.documentElement.style.fontSize=Math.max(7,fs)+'px';
 app.style.width=aw+'px';app.style.left=(w-aw)/2+'px';
 document.body.classList.toggle('land',land);document.body.classList.toggle('port',!land);
 if(G.onResize)G.onResize();}

function after(ms,fn){const id=setTimeout(fn,ms);G.timers.push(id);return id;}
function stopAll(){G.timers.forEach(clearTimeout);G.timers=[];cancelAnimationFrame(G.raf);G.running=false;G.update=null;G.onTime=null;G.onResize=null;G.hint=null;}
function loop(){let last=performance.now();G.running=true;
 const f=now=>{if(!G.running)return;const dt=Math.min(.05,(now-last)/1000);last=now;
  if(G.onTime){G.tLeft-=dt;const r=Math.max(0,G.tLeft/G.tTotal);timerBar.style.transform='scaleX('+r+')';timerEl.classList.toggle('low',G.tLeft<=5);
   if(G.tLeft<=0){const cb=G.onTime;G.onTime=null;cb();if(!G.running)return;}}
  if(G.update)G.update(dt);G.raf=requestAnimationFrame(f);};
 G.raf=requestAnimationFrame(f);}
function setTimer(sec,cb){G.tLeft=G.tTotal=sec;G.onTime=cb;timerBar.style.transform='scaleX(1)';timerEl.classList.remove('low');}

const P2=[{k:'helmet',nm:'안전모',bad:{c:'#59c08a',c2:'#2f9d63'}},{k:'ext',nm:'소화기',bad:{c:'#4f8fe8'}},{k:'chair',nm:'의자',bad:{c:'#f59331',c2:'#d87412'}}];
function play2(){
 const plan=[];[6,5,5].forEach((n,pi)=>{const d=shuffle(Array.from({length:n},(_,i)=>i<(pi===0?2:pi===1?2:3)?1:0));
  if(pi===0)d[0]=0;const kinds=shuffle(['crack','miss','color']);let ki=0;
  d.forEach(x=>plan.push({pi,def:x?kinds[ki++%3]:null}));});
 const total=plan.filter(x=>x.def).length;let caught=0,wrong=0,missed=0,idx=0,spawnT=.3,done=0;const items=[];
 main.innerHTML='<div class="s2"><div class="s2top"><div class="sample"><span class="ic" id="smp"></span><div><small>기준 견본</small><span id="smpN"></span></div></div><div class="cnt">걸러 낸 불량 <b id="c1">0</b> / '+total+'<br>놓친 불량 <i id="c2">0</i></div></div><div class="beltwrap"><div class="belt"><div class="track"></div><div class="truck">'+IC.truck()+'</div></div></div></div>';
 const belt=main.querySelector('.belt'),truck=main.querySelector('.truck');
 function sample(pi){$('#smp').innerHTML=IC[P2[pi].k]();$('#smpN').textContent=P2[pi].nm;const b=main.querySelector('.sample');b.style.animation='none';void b.offsetWidth;b.style.animation='pulse .4s';if(pi>0)say('이번 물품은 '+jo(P2[pi].nm,'이에요','예요')+'. 견본을 다시 봐 주세요.');}
 sample(0);
 function upd(){$('#c1').textContent=caught;$('#c2').textContent=missed;}
 function spawn(){const p=plan[idx++],P=P2[p.pi];if(idx===1||plan[idx-2].pi!==p.pi)sample(p.pi);
  const o={};if(p.def==='crack')o.crack=1;if(p.def==='miss')o.miss=1;if(p.def==='color')Object.assign(o,P.bad);
  const n=el('div','item',IC[P.k](o));const it={n,x:0,def:p.def,state:0};belt.appendChild(n);items.push(it);
  tap(n,()=>{if(it.state)return;
   if(it.def){it.state=2;caught++;n.dataset.st='불합격';n.classList.add('out');Snd.play('stamp');popAt(n,'불량 발견!','g');say({crack:'금이 간 제품이었어요.',miss:'부품이 빠진 제품이었어요.',color:'견본과 색이 다른 제품이었어요.'}[it.def],'good');done++;after(460,()=>n.remove());}
   else{it.state=1;wrong++;n.dataset.st='정상';n.classList.add('okd');Snd.play('bad');say('이건 견본과 똑같은 정상 제품이에요.','bad');}
   upd();});}
 G.update=dt=>{spawnT-=dt;
  /* 물품 종류가 바뀔 때는 앞 물품이 다 지나간 뒤에 견본을 바꾸고 새 물품을 올린다 */
  if(idx<plan.length&&spawnT<=0&&(idx===0||plan[idx].pi===plan[idx-1].pi||done>=idx)){spawn();spawnT=1.65;}
  const W=belt.clientWidth,tw=truck.clientWidth,end=W-tw*.7;
  for(const it of items){if(it.state===2||it.state===3)continue;it.x+=dt/5.4;it.n.style.left=(it.x*end)+'px';
   if(it.x>=1){it.state=3;done++;it.n.remove();if(it.def){missed++;Snd.play('bad');truck.classList.remove('alert');void truck.offsetWidth;truck.classList.add('alert');popAt(truck,'불량 납품…','b');say('불량품이 그대로 납품됐어요. 견본과 잘 비교해 보세요.','bad');upd();}}}
  if(done>=plan.length){G.update=null;after(500,end2);}};
 G.hint=()=>{const it=items.find(i=>i.def&&!i.state&&i.x>.1&&i.x<.82);return it?it.n:null;};
 function end2(){const s=caught-wrong;finish(1,s>=total-1&&missed<=1?3:s>=Math.ceil(total/2)?2:1,'불량품 '+total+'개 중 '+caught+'개를 걸러 냈어요.');}
 say(ST[1].how);setTimer(52,end2);loop();}

/* ---------- 4. 원자재 비축 ---------- */
const M4=[{k:'al',nm:'알루미늄',c:'#cfd8e6'},{k:'cu',nm:'구리',c:'#e39a62'},{k:'zn',nm:'아연',c:'#a9c4de'},{k:'pb',nm:'납',c:'#9aa3b5'},{k:'sn',nm:'주석',c:'#efe6c4'},{k:'ni',nm:'니켈',c:'#bfd3a8'}];
function play4(){const stock=[0,0,0,0,0,0];let delivered=0,asked=0,cur=-1,phase=0;
 main.innerHTML='<div class="s4"><div class="phase" id="ph">평소 · 금속을 눌러 창고에 모으세요</div><div class="field" id="fld"></div><div class="ware" id="ware"></div></div>';
 const fld=$('#fld'),ware=$('#ware'),ph=$('#ph');
 M4.forEach((m,i)=>{const s=el('button','slot','<div class="chip" style="background:'+m.c+'">'+m.nm+'</div><div class="pips"><i class="pip"></i><i class="pip"></i><i class="pip"></i></div>');
  tap(s,()=>{if(phase!==1||cur<0)return;
   if(i===cur&&stock[i]>0){stock[i]--;delivered++;pips();flash(s,'hit');Snd.play('good');popAt(s,'방출!','g');say(jo(M4[i].nm,'을','를')+' 공장에 보냈어요. 공장이 다시 돌아가요.','good');const a=fld.querySelector('.ask');if(a)a.classList.add('run');cur=-1;after(650,ask);}

 function flash(s,c){s.classList.remove('hit','miss');void s.offsetWidth;s.classList.add(c);clearTimeout(s._ft);s._ft=setTimeout(()=>s.classList.remove('hit','miss'),420);}
 function pips(){[...ware.children].forEach((s,i)=>s.querySelectorAll('.pip').forEach((p,k)=>p.classList.toggle('on',k<stock[i])));}
 let bag=[],spT=.2;const live=[];
 function spawn(){if(!bag.length)bag=shuffle([0,1,2,3,4,5]);const i=bag.pop(),m=M4[i];
  const n=el('div','ingot',m.nm);n.style.background=m.c;n.style.left=(12+rnd()*76)+'%';n.style.top=(18+rnd()*64)+'%';fld.appendChild(n);

 function crisis(){phase=1;live.forEach(x=>{x.dead=true;x.n.remove();});ph.textContent='공급망 위기! · 공장이 찾는 금속을 창고에서 눌러 내보내세요';ph.classList.add('crisis');Snd.play('alarm');

  setTimer(26,end);after(900,ask);}

const R5=[[{ic:'water',nm:'정수 장치',need:'깨끗한 물이 필요해요'},{ic:'medical',nm:'의료 장비',need:'병원 장비를 찾고 있어요'},{ic:'led',nm:'LED 가로등',need:'밤길을 밝히고 싶어요'}],
 [{ic:'ext',nm:'소방 장비',need:'불을 빨리 꺼야 해요'},{ic:'laptop',nm:'교육용 노트북',need:'학교에 컴퓨터가 필요해요'},{ic:'camera',nm:'교통 안전 장치',need:'도로를 안전하게 하고 싶어요'}]];
function play5(){let r=0,doneAll=0,miss=0;
 function round(){if(r>=R5.length)return end();const set=R5[r],L=shuffle([0,1,2]),Rr=shuffle([0,1,2]);let sel=-1,done=0;const links=[];
  main.innerHTML='<div class="s5"><svg class="links"></svg><div class="col" id="cl"></div><div class="col" id="cr"></div></div>';
  const cl=$('#cl'),cr=$('#cr'),svg=main.querySelector('.links'),wrap=main.querySelector('.s5');const ln={},rn={};
  L.forEach(i=>{const n=el('button','node',ic(set[i].ic)+'<div><div class="t1">우리 기업</div><div class="t2">'+set[i].nm+'</div></div>');ln[i]=n;cl.appendChild(n);
   tap(n,()=>{if(n.classList.contains('done'))return;Object.values(ln).forEach(x=>x.classList.remove('sel'));n.classList.add('sel');sel=i;Snd.play('tap');say('이제 '+jo(set[i].nm,'이','가')+' 필요한 해외 조달시장을 눌러 주세요.');});});
  Rr.forEach(i=>{const n=el('button','node',ic('globe')+'<div><div class="t1">해외 조달시장</div><div class="t2">'+set[i].need+'</div></div>');rn[i]=n;cr.appendChild(n);
   tap(n,()=>{if(n.classList.contains('done'))return;if(sel<0){say('먼저 우리 기업을 눌러 주세요.');Snd.play('tap');return;}
    if(sel===i){const a=ln[i];a.classList.remove('sel');a.classList.add('done');n.classList.add('done');a.appendChild(el('span','gp','G-PASS'));links.push([a,n]);draw();fly(a,n);Snd.play('good');Snd.play('fly');popAt(n,'수출 연결!','g');say(set[i].nm+' 기업이 해외 조달시장에 진출했어요.','good');sel=-1;done++;doneAll++;if(done===3){r++;after(1300,round);}}
    else{miss++;n.classList.remove('wrong');void n.offsetWidth;n.classList.add('wrong');Snd.play('bad');say('여기는 다른 제품을 찾고 있어요.','bad');}});});
  function pt(n){const b=n.getBoundingClientRect(),w=wrap.getBoundingClientRect();return[b.left-w.left+b.width/2,b.top-w.top+b.height/2,b.width,b.height];}
  function ends(a,b){const A=pt(a),B=pt(b),land=document.body.classList.contains('land');return land?[A[0]+A[2]/2,A[1],B[0]-B[2]/2,B[1]]:[A[0],A[1]+A[3]/2,B[0],B[1]-B[3]/2];}
  function draw(){svg.innerHTML=links.map(([a,b])=>{const e=ends(a,b);return'<line x1="'+e[0]+'" y1="'+e[1]+'" x2="'+e[2]+'" y2="'+e[3]+'" stroke="#1f9d63" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10"/>';}).join('');}
  function fly(a,b){const e=ends(a,b),p=el('div','plane',IC.plane());wrap.appendChild(p);const ang=Math.atan2(e[3]-e[1],e[2]-e[0])*180/Math.PI+24;
   const an=p.animate([{left:e[0]+'px',top:e[1]+'px',transform:'rotate('+ang+'deg)'},{left:e[2]+'px',top:e[3]+'px',transform:'rotate('+ang+'deg)'}],{duration:800,easing:'ease-in-out'});an.onfinish=()=>p.remove();}
  G.onResize=draw;
  G.hint=()=>{if(done>=3)return null;if(sel>=0&&!ln[sel].classList.contains('done'))return rn[sel];const i=L.find(k=>!ln[k].classList.contains('done'));return i==null?null:ln[i];};}
 function end(){finish(4,doneAll>=6&&miss<=1?3:doneAll>=3?2:1,'우리 기업 '+doneAll+'곳을 해외 조달시장과 이었어요.');}
 say(ST[4].how);setTimer(50,end);loop();round();}

const PLAY=[play1,play2,play3,play4,play5];

/* ---------- 첫 화면, 마지막 화면 ---------- */
function showTitle(){stopAll();G.stage=-1;G.screen='title';G.stars=[0,0,0,0,0];hud();main.innerHTML='';ov.classList.remove('show');$('#final').classList.remove('show');
 const t=$('#title');
 t.innerHTML='<div class="gov"><img src="'+IMG.logo+'" alt="조달청"></div><div class="t-kicker">나라의 장을 보는 하루</div><h1 class="t-title">척척 조달관</h1><p class="t-sub">다섯 가지 일을 척척 해내고 나라의 장바구니를 채워 주세요</p><div class="t-art"><img src="'+IMG.narmi+'" alt="나르미"><span class="ic cart">'+IC.cart()+'</span><img src="'+IMG.dari+'" alt="달이"></div><button class="btn">시작하기</button><p class="t-note">마우스 클릭이나 터치만으로 합니다 · 한 판에 약 4분</p><p class="t-credit">2026 조달청 AI 게임·콘텐츠 공모전 출품작<br>안내 캐릭터 나르미·달이는 조달청 마스코트입니다</p>';
 t.classList.add('show');const b=t.querySelector('.btn');G.hint=()=>b;
 b.addEventListener('click',()=>{Snd.play('tap');Snd.music();t.classList.remove('show');showIntro(0);},{once:true});}
function showFinal(){stopAll();G.screen='final';G.stage=5;hud();const tot=G.stars.reduce((a,b)=>a+b,0);
 const rank=tot>=13?'척척 조달관':tot>=9?'든든한 조달관':'새내기 조달관';Snd.play('fanfare');
 const f=$('#final');
 f.innerHTML='<div class="gov"><img src="'+IMG.logo+'" alt="조달청"></div><div class="f-card"><div class="f-top"><img src="'+IMG.narmi+'" alt=""><div><div class="f-total">오늘의 결과 '+IC.star(true)+' '+tot+' / 15</div><div class="f-rank">'+rank+'</div></div><img src="'+IMG.dari+'" alt=""></div><ul class="f-list">'+ST.map((s,i)=>'<li><span class="n">'+(i+1)+'</span><span class="tx">'+s.done+'</span><span class="st">'+starsHTML(G.stars[i])+'</span></li>').join('')+'</ul><p class="f-msg">조달은 나라의 살림을 공정하고 알뜰하게 채우는 일입니다.</p><div class="f-btns"><button class="btn" id="again">다시 하기</button><button class="btn ghost" id="srcBtn">출처 보기</button></div><div class="f-src" id="srcBox">'+SOURCES.join('<br>')+'</div></div>';
 f.classList.add('show');G.hint=()=>$('#again');
 $('#again').addEventListener('click',()=>{Snd.play('tap');showTitle();});
 $('#srcBtn').addEventListener('click',()=>{Snd.play('tap');$('#srcBox').classList.toggle('show');});}

/* ---------- 소리 단추 ---------- */
const sb=$('#sndBtn');sb.innerHTML=IC.sndOn;sb.addEventListener('click',()=>{sb.innerHTML=Snd.toggle()?IC.sndOn:IC.sndOff;});

/* ---------- 자동 점검용(주소에 ?qa 를 붙였을 때만) ---------- */
if(QA||REC)window.__qa={state:()=>({screen:G.screen,stage:G.stage,stars:G.stars.slice()}),
 hint:()=>{const n=G.hint&&G.hint();if(!n||!n.isConnected)return null;const b=n.getBoundingClientRect();return{x:b.left+b.width/2,y:b.top+b.height/2};},
 jump:i=>showIntro(i)};
/* 시연영상 녹화용(주소에 ?rec 를 붙였을 때만): 화면에 마우스 화살표와 클릭 표시를 그린다 */
if(REC){const c=el('div','','<svg viewBox="0 0 24 24"><path d="M4 2l15 9-7 1.6L9 20z" fill="#fff" stroke="#1b2540" stroke-width="1.6" stroke-linejoin="round"/></svg>');c.id='cur';document.body.appendChild(c);
 const mv=e=>{c.style.transform='translate('+e.clientX+'px,'+e.clientY+'px)';};
 addEventListener('pointermove',mv,true);
 addEventListener('pointerdown',e=>{mv(e);const r=el('div','rip');r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),460);},true);}
window.addEventListener('error',e=>{(window.__errs=window.__errs||[]).push(String(e.message));});

guideImg.src=IMG.narmi;fit();showTitle();
})();
</script>
</body>
